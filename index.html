<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#15182f"><title>末班車！月台大混亂 · 進階挑戰版</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101325;color:#fff;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}body{display:flex;justify-content:center;align-items:center;padding:8px}#shell{position:relative;width:min(100%,460px);aspect-ratio:420/720;max-height:calc(100dvh - 16px);overflow:hidden;border:1px solid #434365;border-radius:22px;box-shadow:0 20px 70px #0008;background:#171a36;touch-action:manipulation}canvas{width:100%;height:100%;display:block;touch-action:none}#top{position:absolute;left:0;right:0;top:0;display:flex;gap:7px;align-items:center;justify-content:space-between;padding:14px 12px;pointer-events:none}#top .stat{background:#10142fbf;border:1px solid #ffffff32;border-radius:12px;padding:6px 8px;min-width:65px;text-align:center;backdrop-filter:blur(7px)}.small{display:block;color:#d6d8f0;font-size:10px;font-weight:800;letter-spacing:.1em}.num{display:block;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}#pause{pointer-events:auto;border:1px solid #ffffff55;background:#161a39dc;color:white;border-radius:11px;padding:10px;font-size:16px;cursor:pointer}#bottom{position:absolute;bottom:12px;left:10px;right:10px;display:flex;gap:8px;align-items:stretch}button{font:inherit;cursor:pointer;touch-action:manipulation}.lane{flex:1;min-width:0;border:2px solid #ffffff35;color:#fdfdff;background:#1b234de8;border-radius:15px;padding:9px 3px 11px;box-shadow:0 4px 0 #090d23;font-weight:900;font-size:14px}.lane span{display:block;font-size:22px;line-height:28px}.lane.active{background:#f2f5ff;color:#171b34;transform:translateY(2px);box-shadow:0 2px 0 #090d23}.lane[data-lane="0"]{border-color:#ffb3ba}.lane[data-lane="1"]{border-color:#ffe6a2}.lane[data-lane="2"]{border-color:#9dd8ff}#slow{width:77px;background:#6548a8e8;color:#fff;border:2px solid #c8afff;border-radius:15px;font-size:12px;font-weight:900;padding:6px 2px;box-shadow:0 4px 0 #090d23}#slow[disabled]{opacity:.5;filter:grayscale(.5)}#slow strong{display:block;font-size:18px}#hint{position:absolute;top:88px;left:0;right:0;text-align:center;color:#fff2c1;font-size:13px;font-weight:900;pointer-events:none;text-shadow:0 2px 6px #0008;min-height:24px}#overlay{position:absolute;inset:0;background:linear-gradient(145deg,#161632e9,#1b2953eb);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 28px 56px;z-index:4}#overlay.hide{display:none}#overlay .emoji{font-size:68px;filter:drop-shadow(0 8px 6px #0005);animation:bob 2.5s ease-in-out infinite}#overlay h1{font-size:clamp(30px,7.5vw,42px);margin:12px 0;color:#fff3c8;line-height:1.14;text-shadow:3px 4px #7f558a}#overlay p{color:#e0e6ff;line-height:1.85;margin:8px 0;font-size:15px}#overlay button{border:0;color:#161b35;background:linear-gradient(100deg,#ffe7a9,#ffc1d9);padding:13px 34px;border-radius:15px;font-weight:1000;font-size:19px;margin-top:17px;box-shadow:0 5px 0 #b877a0}#overlay .note{font-size:12px;color:#bfc8ed;margin-top:16px}#overlay .record{color:#ffebbd;font-size:15px;font-weight:800;margin-top:8px}@keyframes bob{50%{transform:translateY(-8px)}}@media(max-height:650px){#top{padding:8px 8px}#hint{top:62px}#bottom{bottom:5px}#overlay{padding:10px 22px 30px}#overlay .emoji{font-size:45px}#overlay h1{font-size:29px}#overlay p{font-size:13px;line-height:1.5}}
#difficulty{display:flex;gap:7px;margin:12px 0 3px;width:100%;max-width:320px}#difficulty button{flex:1;padding:9px 2px;border-radius:12px;background:#292f59;color:#e5e9ff;border:1px solid #98a5e266;font-weight:900;font-size:14px}#difficulty button.chosen{background:#ffe5b3;color:#272c42;border-color:#ffe5b3;box-shadow:0 3px 0 #8e6c53}#overlay .desc{font-size:12px;color:#c9d5f4;line-height:1.6;margin:6px 0;max-width:325px}#cooldown{position:absolute;left:15px;right:15px;bottom:103px;z-index:2;pointer-events:none;text-align:center;font-weight:850;color:#ffeaba;font-size:12px;text-shadow:0 2px 6px #000}#cooldown>div{height:4px;margin-top:5px;border-radius:8px;background:#ffffff28;overflow:hidden}#coolfill{height:100%;width:0;background:#fdd58a}#difficulty button{margin-top:0;box-shadow:none}#overlay #start{margin-top:12px}@media(max-height:650px){#cooldown{bottom:88px}#difficulty{margin:4px 0}}
</style>
</head><body>
<div id="shell">
<canvas id="game" aria-label="列車轉軌遊戲"></canvas>
<div id="top"><div class="stat"><span class="small">得分</span><span id="score" class="num">0</span></div><div class="stat"><span class="small">COMBO</span><span id="combo" class="num">×0</span></div><div class="stat"><span class="small">時間</span><span id="time" class="num">45</span></div><div class="stat"><span class="small">機會</span><span id="lives" class="num">♥♥♥</span></div><button id="pause" aria-label="暫停">Ⅱ</button></div>
<div id="hint" aria-live="polite"></div><div id="cooldown"><span id="cooltext"></span><div><div id="coolfill"></div></div></div>
<div id="bottom"><button class="lane" data-lane="0"><span>🌸</span>花站</button><button class="lane" data-lane="1"><span>⭐</span>星站</button><button class="lane" data-lane="2"><span>🌙</span>月站</button><button id="slow" disabled><strong>⏱</strong><span id="slowLabel">慢動作 0/6</span></button></div>
<div id="overlay"><div class="emoji" id="hero">🚋✨</div><h1 id="headline">末班車！<br>月台大混亂</h1><p id="message">列車快到岔路了！<br>看車頂的圖案，點選相同的月台。<br>🌸 花站　⭐ 星站　🌙 月站<br>連續送對 6 班，解鎖慢動作！</p><div class="record" id="record"></div><div id="difficulty"><button data-diff="normal" class="chosen">普通模式</button><button data-diff="hard">挑戰模式</button><button data-diff="expert">極限模式</button></div><div class="desc" id="diffDesc">循序加速，適合第一次體驗。<br>特快車／雙車連發／短暫轉軌冷卻。</div><button id="start">開始發車！</button><div class="note">每局 45 秒｜手機單手可玩｜鍵盤 1／2／3 切換</div></div>
</div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=420,H=720;
const $=id=>document.getElementById(id),laneBtns=[...document.querySelectorAll('.lane')];
const icons=['🌸','⭐','🌙'],names=['花站','星站','月站'],colors=['#ff9fb5','#ffe18b','#99d4ff'],xs=[84,210,336];
let difficulty='normal',switchCool=0,trackEvent=0,trackEventLabel='',streakBest=0,served=0,mode='menu',selected=1,trains=[],particles=[],score=0,combo=0,lives=3,remaining=45,spawnIn=0,slowCharge=0,slowLeft=0,flash=0,cityGlow=0,eventIn=11,eventLeft=0,eventText='',last=performance.now(),sound=null,mark='',markLeft=0,runTime=0;
let best=0;try{best=Number(localStorage.getItem('lasttrain_best')||0)||0}catch(e){}
function resize(){let ratio=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*ratio);canvas.height=Math.round(H*ratio);ctx.setTransform(ratio,0,0,ratio,0,0)}resize();window.addEventListener('resize',resize);
const CFG={normal:{speed:1,gap:1,lock:.12,lives:3,label:'普通'},hard:{speed:1.23,gap:.83,lock:.30,lives:3,label:'挑戰'},expert:{speed:1.44,gap:.72,lock:.40,lives:2,label:'極限'}};
function pick(n){if(mode!=='playing')return;if(n===selected)return;if(switchCool>0){notice('⏳ 轉軌冷卻中！');return}selected=n;switchCool=CFG[difficulty].lock;updateButtons();blip(450+n*90,.045);}
function setDiff(d){if(mode==='playing'||mode==='paused')return;difficulty=d;document.querySelectorAll('[data-diff]').forEach(b=>b.classList.toggle('chosen',b.dataset.diff===d));$('diffDesc').innerHTML=({normal:'循序加速，適合第一次體驗。<br>特快車／雙車連發／短暫轉軌冷卻。',hard:'列車更快、雙車更密集；轉軌有 0.3 秒冷卻。',expert:'只有兩次失誤機會！列車超快，轉軌冷卻更長。'})[d]}
function updateButtons(){laneBtns.forEach((b,i)=>b.classList.toggle('active',i===selected));$('slow').disabled=slowCharge<6||mode!=='playing';$('slowLabel').textContent=slowLeft>0?'減速中！':`慢動作 ${slowCharge}/6`}
function audio(){try{sound=sound||new(window.AudioContext||window.webkitAudioContext)();if(sound.state==='suspended')sound.resume()}catch(e){}}
function blip(freq=500,dur=.09){try{if(!sound)return;const o=sound.createOscillator(),g=sound.createGain();o.type='sine';o.frequency.setValueAtTime(freq,sound.currentTime);g.gain.setValueAtTime(.055,sound.currentTime);g.gain.exponentialRampToValueAtTime(.001,sound.currentTime+dur);o.connect(g).connect(sound.destination);o.start();o.stop(sound.currentTime+dur)}catch(e){}}
function notice(t){mark=t;markLeft=1.25;$('hint').textContent=t}
function start(){audio();mode='playing';selected=1;trains=[];particles=[];score=0;combo=0;lives=CFG[difficulty].lives;remaining=45;spawnIn=.65;switchCool=0;trackEvent=0;trackEventLabel='';served=0;streakBest=0;slowCharge=0;slowLeft=0;flash=0;eventIn=10;eventLeft=0;eventText='';runTime=0;cityGlow=0;$('overlay').classList.add('hide');notice('注意特快車 🚄 與雙車連發 ⚡！');hud();updateButtons();last=performance.now()}
function pause(){if(mode==='playing'){mode='paused';show('⏸','列車暫停中','準備好後繼續發車。','繼續遊戲');}else if(mode==='paused'){mode='playing';$('overlay').classList.add('hide');last=performance.now()}}
function show(em,title,msg,btn){$('hero').textContent=em;$('headline').innerHTML=title;$('message').innerHTML=msg;$('start').textContent=btn;$('record').textContent=best?'個人最高分：'+best:'';$('overlay').classList.remove('hide')}
function gameOver(){mode='over';if(score>best){best=score;try{localStorage.setItem('lasttrain_best',String(best))}catch(e){}}const rank=score>=900?'傳說中的月台長':score>=500?'金牌調度員':score>=220?'合格站務員':'見習小站長';show('🏙️','調度完成！',`<b>${CFG[difficulty].label}模式</b>｜得分：<b>${score}</b><br>成功調度：${served} 班｜最高連擊：×${streakBest}<br>稱號：${rank}<br>挑戰更高難度，刷新最高分！`,'再玩一次')}
function hud(){$('score').textContent=score;$('combo').textContent='×'+combo;$('time').textContent=Math.ceil(Math.max(0,remaining));$('lives').textContent='♥'.repeat(lives)+'♡'.repeat(CFG[difficulty].lives-lives)}
function spawn(){const type=Math.floor(Math.random()*3),isGold=Math.random()<.12,express=runTime>7&&Math.random()<(.13+(difficulty==='normal'?0:.09));trains.push({type,isGold,express,y:116,x:210,locked:false,lane:-1,done:false,wobble:Math.random()*10});if(express)notice('🚄 特快車！速度更快');}
function spawnDouble(){spawn();spawnIn=.55;notice('⚡ 雙車連發！準備接下一班');}
function burst(x,y,col,n=15){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=25+Math.random()*125;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,life:.4+Math.random()*.5,max:.9,c:col,r:2+Math.random()*4})}}
function update(dt){if(mode!=='playing')return;runTime+=dt;switchCool=Math.max(0,switchCool-dt);$('cooltext').textContent=switchCool>.01?'轉軌冷卻 '+switchCool.toFixed(1)+' 秒':'';$('coolfill').style.width=(switchCool/CFG[difficulty].lock*100)+'%';remaining-=dt;if(remaining<=0){remaining=0;hud();gameOver();return}let gameDt=dt*(slowLeft>0?.45:1);if(slowLeft>0)slowLeft=Math.max(0,slowLeft-dt);eventIn-=dt;if(eventIn<=0){eventIn=11+Math.random()*6;eventLeft=3.5;eventText='⚡ 尖峰時刻！列車加速';notice(eventText)}if(eventLeft>0)eventLeft-=dt;markLeft=Math.max(0,markLeft-dt);if(markLeft===0)$('hint').textContent='';flash=Math.max(0,flash-dt*2);cityGlow+=(Math.min(1,score/850)-cityGlow)*dt*.7;
spawnIn-=gameDt;const base=CFG[difficulty],interval=Math.max(.85, (2.00-runTime*.017)*base.gap);if(spawnIn<=0){spawn();spawnIn=interval;if(runTime>9&&Math.random()<(.10+(difficulty==='normal'?0:.08))){spawnIn=.75;notice('⚡ 雙車連發！')}}
for(const t of trains){let speed=(156+Math.min(95,runTime*1.75))*CFG[difficulty].speed*(t.express?1.30:1)*(eventLeft>0?1.13:1);t.y+=speed*gameDt;if(!t.locked&&t.y>=347){t.locked=true;t.lane=selected;blip(300,.07)}let u=Math.max(0,Math.min(1,(t.y-347)/170));let eased=u*u*(3-2*u);t.x=210+(xs[t.locked?t.lane:1]-210)*eased;if(t.y>=568&&!t.done){t.done=true;let good=t.lane===t.type;if(good){combo++;served++;streakBest=Math.max(streakBest,combo);let points=10+Math.min(40,combo*2)+(t.isGold?25:0)+(t.express?15:0);score+=points;slowCharge=Math.min(6,slowCharge+1);burst(t.x,565,colors[t.type],t.isGold?26:14);blip(680+combo*30,.14);flash=.25;notice((t.express?'🚄 特快送達！ ':t.isGold?'🌟 黃金列車！ ':'')+'完美抵達 +'+points)}else{combo=0;lives--;slowCharge=Math.max(0,slowCharge-2);burst(t.x,565,'#ff6f8a',20);blip(140,.24);notice('哎呀！送錯月台了');flash=.48;}hud();updateButtons();if(lives<=0){gameOver();break}}}trains=trains.filter(t=>!t.done);
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=140*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
hud();updateButtons()}
function rounded(x,y,w,h,r,fill,stroke,line=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}}
function text(t,x,y,size=16,color='#fff',align='center',weight=800){ctx.fillStyle=color;ctx.textAlign=align;ctx.font=`${weight} ${size}px system-ui,"Noto Sans TC",sans-serif`;ctx.fillText(t,x,y)}
function draw(){const night=cityGlow;let sky=ctx.createLinearGradient(0,0,0,620);sky.addColorStop(0,'#191d3c');sky.addColorStop(.6,night>.5?'#3a3867':'#28294e');sky.addColorStop(1,'#11182e');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// twinkling stars and skyline transformed by play
for(let i=0;i<33;i++){let x=(i*139+31)%W,y=95+(i*57)%190;ctx.globalAlpha=.16+.3*(Math.sin(runTime*.8+i)+1)/2;ctx.fillStyle=i%3?'#fff':'#ffe4a1';ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;
for(let i=0;i<14;i++){let x=i*34-8,h=65+(i*31)%98,y=347-h;ctx.fillStyle=i%3===0?'#222847':'#202743';ctx.fillRect(x,y,30,h);for(let j=0;j<6;j++)for(let k=0;k<2;k++){if(((i*17+j*11+k*3)%10)/10<.13+night*.68){ctx.fillStyle=k?'#ffd68f':'#9bdbff';ctx.fillRect(x+7+k*12,y+11+j*17,5,7)}}}
// board and entrance
rounded(136,96,148,58,15,'#11142bcf','#ffffff44');text('🚋 末班車',210,119,19,'#fff4d0');text('看車頭圖案，切換路線',210,140,10,'#c7d0f1');
// branching tracks
ctx.lineCap='round';ctx.lineJoin='round';for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(210,151);ctx.lineTo(210,347);ctx.bezierCurveTo(210,430,xs[i],465,xs[i],573);ctx.strokeStyle='#0d152a';ctx.lineWidth=29;ctx.stroke();ctx.strokeStyle=(selected===i?'#f5dfb3':'#7c84a1');ctx.lineWidth=7;ctx.stroke();ctx.strokeStyle=(selected===i?'#fff8df66':'#9397bb48');ctx.lineWidth=2;ctx.setLineDash([7,15]);ctx.stroke();ctx.setLineDash([])}
// switch at fork
ctx.beginPath();ctx.arc(210,347,20,0,Math.PI*2);ctx.fillStyle='#34334d';ctx.fill();ctx.strokeStyle='#f7e7bd';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.translate(210,347);ctx.rotate((selected-1)*.48);ctx.strokeStyle='#fff0b6';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(0,11);ctx.stroke();ctx.restore();
// destination platforms
for(let i=0;i<3;i++){const active=i===selected;rounded(xs[i]-45,561,90,51,14,active?'#ede8e2':'#2b3357',colors[i],active?4:2);text(icons[i],xs[i],587,24);text(names[i],xs[i],603,11,active?'#25304a':'#e5eaff');}
// decorative lamp posts
for(const x of [16,404]){ctx.fillStyle='#7688a8';ctx.fillRect(x-2,376,4,204);ctx.beginPath();ctx.arc(x,375,11,0,7);ctx.fillStyle='#fbe3a7';ctx.fill();}
for(const t of trains){ctx.save();ctx.translate(t.x,t.y);const sc=t.isGold?1.12:1;ctx.scale(sc,sc);rounded(-27,-34,54,68,14,t.express?'#b9ffe3':t.isGold?'#f7cd6e':'#dbe9ff','#2a3050',3);rounded(-21,-27,42,33,8,'#45557b');text(icons[t.type],0,-1,27);if(t.express)text('EXP',0,-18,8,'#142f35');rounded(-22,14,44,14,5,t.isGold?'#de9951':'#8ca9d7');ctx.fillStyle='#f4fcff';ctx.fillRect(-17,33,10,4);ctx.fillRect(7,33,10,4);ctx.restore();}
for(const p of particles){ctx.globalAlpha=Math.min(1,p.life/.45);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
if(eventLeft>0){rounded(101,170,218,30,13,'#a54c8bc9');text('⚡ 尖峰時刻：加速！',210,191,14,'#fff')}
if(slowLeft>0){ctx.fillStyle='#aabaff12';ctx.fillRect(0,0,W,H);text('✦ 慢動作生效中 ✦',210,220,15,'#d0c5ff')}
if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.13})`;ctx.fillRect(0,0,W,H)}
rounded(11,627,398,15,8,'#141a37','#ffffff30');rounded(15,631,390*(1-remaining/45),7,4,'#e9c18f');text('🚄 特快車更快｜⚡ 留意雙車連發',210,654,12,'#d3d9f0');text('按 1 / 2 / 3，或輕觸下方月台',210,675,11,'#adb8d7');}
function loop(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;update(dt);draw();requestAnimationFrame(loop)}
document.querySelectorAll('[data-diff]').forEach(b=>b.addEventListener('click',()=>setDiff(b.dataset.diff)));for(const b of laneBtns)b.addEventListener('pointerdown',e=>{e.preventDefault();pick(Number(b.dataset.lane))});$('slow').addEventListener('click',()=>{if(mode==='playing'&&slowCharge>=6&&slowLeft===0){slowCharge=0;slowLeft=4.5;notice('⏱ 時光煞車！4.5 秒慢動作');blip(920,.2);updateButtons()}});$('pause').addEventListener('click',pause);$('start').addEventListener('click',()=>mode==='paused'?pause():start());document.addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key)){pick(Number(e.key)-1)}else if(e.key===' '){e.preventDefault();if(mode==='playing'&&slowCharge>=6)$('slow').click()}else if(e.key.toLowerCase()==='p'||e.key==='Escape'){pause()}else if(e.key==='Enter'&&mode!=='playing'){$('start').click()}});canvas.addEventListener('pointerdown',e=>{if(mode!=='playing')return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;if(y>550){let n=xs.reduce((a,b,i)=>Math.abs(b-x)<Math.abs(xs[a]-x)?i:a,0);pick(n)}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});updateButtons();requestAnimationFrame(loop);
})();
</script></body></html>
